name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SleepTimer.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.SleepTimer.sln --configuration Release --no-restore

      - name: Check browser client syntax
        run: node --check Jellyfin.Plugin.SleepTimer/Web/client.js

      - name: Check browser UI regressions
        run: node scripts/check_client_regressions.mjs

      - name: Check repository metadata
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m py_compile scripts/update_manifest.py
